<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ананасовый улун — Teaboom</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="product-page">
    <article class="product-card">

        <div class="product-card__image">
             <img src="images/pineapple-oolong.jpg" alt="Ананасовый улун">
        </div>

        <div class="product-card__content">
            <p class="product-card__category">Ароматизированный улун</p>
            <h1 class="product-card__title">Ананасовый улун</h1>
           <div class="product-card__sizes">
    <p class="product-card__sizes-title">Фасовка</p>

    <div class="product-card__sizes-list">
        <button id="size100" class="product-card__size product-card__size--active" type="button">100 г</button>
        <button id="size500" class="product-card__size" type="button">500 г</button>
        <button id="size1000" class="product-card__size" type="button">1000 г</button>
        <button id="size5000" class="product-card__size" type="button">5000 г</button>
    </div>
</div>
    <p class="product-card__article">
        Артикул: <span id="article">01306</span></p>

    <div class="product-card__price">
        <span id="old-price">349,20 ₽</span>
        <strong id="price">326,40 ₽</strong>
    </div>
    <button class="product-card__button" type="button">В корзину</button>
<p class="product-card__description">
    Китайский бирюзовый чай с цукатами и натуральными ароматическими маслами.
    Светлый улун с ярким ароматом ананаса.
</p>
</div>


</div>
    </article>
</main>
    <script src="script.js"></script>
    
</body>
</html>
